<!doctype html><html lang="en"><head><meta charset="utf-8">

<main>
<figure id="quote" role="button" tabindex="0" aria-label="Tesseract quote, tap for next"><div class="qk">The Tesseract</div><blockquote id="qText"></blockquote><figcaption>— Kannan Mohanan <span class="qn">tap for next ›</span></figcaption></figure>
<section id="home" hidden></section>
<div id="sub" hidden></div><section id="flow" hidden></section><div id="filters"><select id="tagFilter"><option value="">All tags</option></select></div>
<section id="habits" hidden></section><section id="journal" hidden></section><section id="travel" hidden></section><div id="count"></div><ul id="list"></ul>
</main>
<form id="add"><input id="addInput" placeholder="Quick add to current list…" autocomplete="off"><button>Add</button></form>
<nav id="tabs"><button data-v="home" class="on"><b>🏠</b>Home</button><button data-v="journal"><b>📓</b>Journal</button><button data-v="tasks"><b>◎</b>Tasks</button><button data-v="habits"><b>🔥</b>Habits</button></nav>
<div id="toast"></div>
<dialog id="edit"><form method="dialog" id="editForm">
<label>Title<input name="title" required></label>
<label>Due<input name="due" type="date"></label>
<label>Notes<textarea name="notes" rows="3"></textarea></label>
<fieldset id="tagBox"><legend>Tags</legend></fieldset>
<label class="row"><input type="checkbox" name="top"> Top priority</label>
<div class="btns"><button value="delete" class="danger" type="submit">Delete</button><button value="cancel" formnovalidate>Cancel</button><button value="save" class="primary">Save</button></div>
</form></dialog>
<dialog id="menu" class="settings"><form method="dialog"><div class="st-h">⚙️ Settings</div><div class="col">
<div class="st-sec">Security</div><div class="st-g" id="stSec"></div>
<div class="st-sec">Sync</div><div class="st-g" id="stSync"></div>
<div class="st-sec">Backup &amp; data</div><div class="st-g"><button value="md">Export Markdown</button><button value="json">Export JSON backup</button>
<button value="importJson">Import JSON backup</button><button value="importMd">Import Markdown (paste)</button></div>
<button value="cancel" class="st-close">Close</button></div></form></dialog>
<dialog id="paste"><form method="dialog"><textarea id="pasteText" rows="12" placeholder="Paste Hey Murph Markdown"></textarea>
<div class="btns"><button value="cancel">Cancel</button><button value="ok" class="primary">Import</button></div></form></dialog>
<dialog id="jedit"><form id="jform"><div class="jrow"><b class="jh">Review</b><span id="jlvl" class="lvl"></span><span id="jst" class="jsts"></span></div>
<div class="jrow"><button data-j="b"><b>B</b> Bold</button><button data-j="h"><mark>H</mark> Highlight</button></div>
<textarea name="text" rows="6"></textarea><div id="jprev" class="jb jprev" hidden></div>
<label>Review comments<textarea name="essence" rows="3" placeholder="Your comments on this entry…"></textarea></label>
<input type="hidden" name="type">
<div class="jrow"><button data-j="proc" class="s-processed">Mark reviewed</button><button data-j="unproc">Back to Record</button></div>
<div id="jexbox" hidden><div class="jlab">Execute</div><div class="jrow"><button data-j="focus" class="d-focus">→ Focus List</button><button data-j="next">→ Next Action</button><button data-j="radar">→ Under Radar</button><button data-j="cold" class="d-cold">→ Cold Storage</button><button data-j="po">→ PO funnel</button><button data-j="del">→ Delivery cases</button><button data-j="pay">→ Payment pending</button><button data-j="notes" class="d-notes">→ Notes</button></div><label>Execution comments<textarea name="xnote" rows="3" placeholder="Comments on execution…"></textarea></label></div>
<div class="btns"><button data-j="del" class="danger">Delete</button><button data-j="cancel">Cancel</button><button data-j="save" class="primary">Save</button></div></form></dialog>
<dialog id="insSheet"><div id="insBody"></div></dialog>
<dialog id="rvSheet"><div id="rvBody"></div></dialog>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script src="config.js"></script><script src="app.js"></script><script src="journal.js"></script><script src="flow.js"></script><script src="dutylog.js"></script><script src="review.js"></script><script src="insight.js"></script><script src="home.js"></script><script src="sync-core.js"></script><script src="sync.js"></script><script src="lock.js"></script></body></html>
