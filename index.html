<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hey Murph</title><meta name="theme-color" content="#070b18">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hey Murph"><link rel="stylesheet" href="style.css"><script>try{if(localStorage.getItem('heymurph.pin.v1'))document.documentElement.classList.add('locked')}catch(e){}</script></head><body>
<div class="bgfx" aria-hidden="true"></div><header><div><div id="greet" class="greet">Hello, sir</div><h1><img class="logo" src="icons/logo.png" alt="" width="30" height="30">Hey Murph</h1><div id="dateLine" class="date"></div></div><button id="menuBtn" class="icon" aria-label="Menu">⋯</button></header>
<main>
<figure id="quote" role="button" tabindex="0" aria-label="Tesseract quote, tap for next"><div class="qk">The Tesseract</div><blockquote id="qText"></blockquote><figcaption>— Kannan Mohanan <span class="qn">tap for next ›</span></figcaption></figure>
<div id="filters"><select id="tagFilter"><option value="">All tags</option></select></div>
<section id="habits" hidden></section><section id="journal" hidden></section><div id="count"></div><ul id="list"></ul>
</main>
<form id="add"><input id="addInput" placeholder="Quick add to current list…" autocomplete="off"><button>Add</button></form>
<nav id="tabs"><button data-v="focus" class="on"><b>◎</b>Focus</button><button data-v="cold"><b>❄</b>Cold Storage</button><button data-v="done"><b>✓</b>Done</button><button data-v="habits"><b>🔥</b>Habits</button><button data-v="journal"><b>📓</b>Journal</button></nav>
<div id="toast"></div>
<dialog id="edit"><form method="dialog" id="editForm">
<label>Title<input name="title" required></label>
<label>Due<input name="due" type="date"></label>
<label>Notes<textarea name="notes" rows="3"></textarea></label>
<fieldset id="tagBox"><legend>Tags</legend></fieldset>
<label class="row"><input type="checkbox" name="top"> Top priority</label>
<div class="btns"><button value="delete" class="danger" type="submit">Delete</button><button value="cancel" formnovalidate>Cancel</button><button value="save" class="primary">Save</button></div>
</form></dialog>
<dialog id="menu"><form method="dialog"><div class="col">
<button value="md">Export Markdown</button><button value="json">Export JSON backup</button>
<button value="importJson">Import JSON backup</button><button value="importMd">Import Markdown (paste)</button><button value="cancel">Close</button></div></form></dialog>
<dialog id="paste"><form method="dialog"><textarea id="pasteText" rows="12" placeholder="Paste Hey Murph Markdown"></textarea>
<div class="btns"><button value="cancel">Cancel</button><button value="ok" class="primary">Import</button></div></form></dialog>
<dialog id="jedit"><form id="jform"><div class="jrow"><b class="jh">Process</b><span id="jlvl" class="lvl"></span><span id="jst" class="jsts"></span></div>
<div class="jrow"><button data-j="b"><b>B</b> Bold</button><button data-j="h"><mark>H</mark> Highlight</button></div>
<textarea name="text" rows="6"></textarea><div id="jprev" class="jb jprev"></div>
<label>Essence (one line)<input name="essence" maxlength="160"></label>
<div class="jrow"><select name="type"><option value="">Type</option><option>Idea</option><option>Quote</option><option>Note</option><option>Link</option><option>Decision</option><option>Review</option></select></div>
<div class="jrow"><button data-j="proc" class="s-processed">Mark processed</button><button data-j="unproc">Back to Record</button></div>
<div class="jlab">Execute</div><div class="jrow"><button data-j="focus" class="d-focus">→ Focus List</button><button data-j="cold" class="d-cold">→ Cold Storage</button><button data-j="notes" class="d-notes">→ Notes</button></div>
<div class="btns"><button data-j="del" class="danger">Delete</button><button data-j="cancel">Cancel</button><button data-j="save" class="primary">Save</button></div></form></dialog>
<dialog id="rvSheet"><form method="dialog" id="rvForm"><div class="rvh">Review</div><div id="rvCtx"></div>
<label>What got done, and did it move the needle?<textarea rows="3"></textarea></label>
<label>What's been sitting too long? Drop it or demote it.<textarea rows="3"></textarea></label>
<label>What did I learn that changes the next ten?<textarea rows="3"></textarea></label>
<div class="btns"><button value="cancel" formnovalidate>Cancel</button><button value="save" class="primary">Save review</button></div></form></dialog>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script src="config.js"></script><script src="app.js"></script><script src="journal.js"></script><script src="review.js"></script><script src="sync-core.js"></script><script src="sync.js"></script><script src="lock.js"></script></body></html>
